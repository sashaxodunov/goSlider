<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>GoSlider</title>
  </head>
  <body>
    <header class="header">
      <a class="header-logo" href="#">
        <img
          class="header-logo-icon"
          src="assets/images/logo.svg"
          alt=""
          srcset=""
        />
        <span class="header-brand">GoSlider</span>
      </a>
      <nav class="nav">
        <a href="#" class="nav-link">Overview</a>
        <a href="#" class="nav-link">Features</a>
        <a href="#" class="nav-link">Technology</a>
        <a href="#" class="nav-link">Design</a>
        <a href="#" class="nav-link">Review</a>
        <a href="#" class="nav-link">Pricing</a>
      </nav>

      <a class="btn" href="#">
        <img
          class="btn-icon"
          src="assets/images/shopping-bag.svg"
          alt=""
          srcset=""
        />order now</a
      >
    </header>

    <section class="hero">
      <div class="container">
        <h1 class="hero-title">slide control</h1>
        <img
          class="hero-image"
          src="assets/images/mouse 1.png"
          alt=""
          srcset=""
        />

        <div class="hero-text">
          <div class="hero-text-col">
            <dl class="hero-list">
              <dt class="hero-list-title">weight</dt>
              <dd class="hero-list-text">55g</dd>
            </dl>
          </div>
          <div class="hero-text-col">
            <dl class="hero-list hero-list-right">
              <dt class="hero-list-title">resolution</dt>
              <dd class="hero-list-text">100-20 000 DPI</dd>
            </dl>
          </div>
        </div>
        <div class="hero-footer">
          <a class="btn btn--large btn--shadow" href="#">
            <img
              class="btn-icon"
              src="assets/images/circle-play.svg"
              alt=""
              srcset=""
            />
            play video</a
          >
        </div>
      </div>
    </section>
  </body>
</html>
